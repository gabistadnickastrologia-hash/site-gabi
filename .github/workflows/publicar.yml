# Publica o site no GitHub Pages a cada envio para o branch principal.
#
# O site é estático: não há compilação. O "build" apenas separa, em _site/,
# o que o navegador precisa — as fotos originais e as ferramentas ficam
# no repositório, mas fora do ar.
name: Publicar o site

on:
  push:
    branches: [claude/site-instagram-art-design-gzjysg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois envios acontecerem juntos, o último ganha — sem cancelar
# uma publicação já em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: liga o GitHub Pages na primeira execução,
      # sem precisar mexer nas configurações do repositório.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar a pasta que vai ao ar
        run: bash ferramentas/publicar.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
